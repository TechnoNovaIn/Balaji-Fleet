; ---------- Production process supervision (supervisord) ----------
; Install: pip install supervisor
; Run:     supervisord -c supervisord.conf
; Why: the shell-tool backgrounding (nohup &) gets reaped when the parent
;      shell session ends. supervisord runs as a daemon (PID 1 for its group)
;      and restarts crashed processes automatically.
;
; All services write logs under %(here)s/logs/
; Data is local; no cloud AI services. The only external dependency is the
; Intangles OBD/GPS API (data source, not an AI service).

[supervisord]
nodaemon=false
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid
childlogdir=%(here)s/logs

[unix_http_server]
file=%(here)s/logs/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[program:api]
command=%(here)s/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=%(here)s
autostart=true
autorestart=true
startretries=5
stdout_logfile=%(here)s/logs/api.log
stderr_logfile=%(here)s/logs/api.err.log

[program:live_poller]
command=%(here)s/.venv/bin/python -u -m scripts.live --interval 60 --lookback-seconds 900
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=%(here)s/logs/live.log
stderr_logfile=%(here)s/logs/live.err.log

[program:backfill]
command=%(here)s/.venv/bin/python -u -m scripts.backfill --days 7 --include-today
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=%(here)s/logs/backfill.log
stderr_logfile=%(here)s/logs/backfill.err.log

[program:train_loop]
command=%(here)s/.venv/bin/python -u -m scripts.train_loop --interval-hours 6
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=%(here)s/logs/train.log
stderr_logfile=%(here)s/logs/train.err.log
startsecs=30

[program:trips_loop]
command=%(here)s/.venv/bin/python -u -m scripts.trips_loop --interval-minutes 15 --days 3
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=%(here)s/logs/trips_loop.log
stderr_logfile=%(here)s/logs/trips_loop.err.log
startsecs=5
