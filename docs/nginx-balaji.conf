server {
    listen 3003 default_server;
    listen [::]:3003 default_server;
    server_name _;

    root /var/www/balaji;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Backend API Reverse Proxy to FastAPI on port 8000
    location ~ ^/(auth|vehicles|telemetry|live|timetable|tonnage|ingest|driver-profiles|health|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Static assets caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
